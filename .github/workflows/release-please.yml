name: Release Please

# Owns versioning: on merge to `stable`, release-please reads the Conventional
# Commits since the last release, computes the SemVer bump, and maintains a
# rolling release PR that bumps pyproject.toml + CHANGELOG.md. That PR
# auto-merges itself (below) as soon as it's mergeable, which tags vX.Y.Z and
# creates the GitHub Release with notes. release.yml then attaches the
# binaries to that tag's release. Promoting main -> stable stays a manual,
# reviewed PR — only the version-bump bookkeeping PR is unattended.

on:
  push:
    branches: ["stable"]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: stable

      - name: Build the binaries for the new tag
        # The tag above is pushed with GITHUB_TOKEN, and GitHub never fires a
        # `push` workflow trigger for token-made events — so release.yml's
        # `on: push: tags` cannot see it (v0.3.1 shipped with no binaries this
        # way). workflow_dispatch is one of the two events exempt from that
        # rule, so dispatch it explicitly against the tag ref.
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" \
            --ref "${{ steps.release.outputs.tag_name }}"

      - name: Auto-merge the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base stable \
            --head release-please--branches--stable --state open \
            --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --merge
          fi

      - name: Sync the version bump back to main
        # release-please only ever bumps pyproject.toml on `stable`, and nothing
        # carries that commit back — so `main` kept reporting the previous
        # version from GET /api/version. Back-merge stable into main on every
        # release. It goes through a PR because main is protection-gated;
        # `gh pr create` fails harmlessly when last release's PR is still open.
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head stable \
            --title "chore: sync ${{ steps.release.outputs.tag_name }} back to main" \
            --body "Automated back-merge so \`main\` carries the released version." \
            || echo "back-merge PR already open"
          gh pr merge stable --repo "$GITHUB_REPOSITORY" --merge
