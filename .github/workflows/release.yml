name: Release

# Builds the double-click desktop bundles. Push a version tag (e.g. v0.1.0) to
# cut a release; the Mac .dmg and Windows .zip are attached to the GitHub Release.
# Trigger a dry run any time from the Actions tab (workflow_dispatch).
#
# release-please.yml owns the tag + GitHub Release (from Conventional Commits on
# `stable`); this workflow only attaches binaries — action-gh-release upserts onto
# the existing release for that tag, so no duplicate release is created.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  frontend:
    # Static output is OS-independent — build it once here instead of once
    # per matrix job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist

  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: MyJobCoach-macos
          - os: windows-latest
            artifact: MyJobCoach-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install Python deps
        # [local] bundles the free in-process AI engine (llama-cpp-python) that
        # onboarding offers — without it the "download the free local model" path
        # is dead in the shipped app and every user needs an OpenRouter key.
        run: uv sync --extra package --extra local

      - name: Build app bundle
        run: uv run pyinstaller packaging/myjobcoach.spec

      # To ship a warning-free app later, add code-signing/notarization here:
      #  - macOS: codesign the .app, then `xcrun notarytool submit` + `stapler`.
      #  - Windows: signtool / Azure Trusted Signing on dist/MyJobCoach/MyJobCoach.exe.

      - name: Package (macOS .dmg)
        # Stage the .app next to an /Applications symlink so the mounted DMG
        # shows both icons side by side — the standard drag-to-install cue,
        # instead of a bare Finder window with just the app.
        if: runner.os == 'macOS'
        run: |
          mkdir dist/dmg-root
          mv "dist/MyJobCoach.app" dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "MyJobCoach" -srcfolder dist/dmg-root \
            -ov -format UDZO "dist/MyJobCoach-macos.dmg"

      - name: Package (Windows .zip)
        # Zip the MyJobCoach folder itself (not just its contents) so
        # extracting anywhere yields one clearly-named folder to keep, mirroring
        # the macOS .app bundle instead of scattering loose files.
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/MyJobCoach -DestinationPath dist/MyJobCoach-windows.zip

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: MyJobCoach-*
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
