name: Release

# Builds the double-click desktop bundles. Push a version tag (e.g. v0.1.0) to
# cut a release; the Mac .dmg and Windows .zip are attached to the GitHub Release.
# Trigger a dry run any time from the Actions tab (workflow_dispatch).
#
# release-please.yml owns the tag + GitHub Release (from Conventional Commits on
# `stable`); this workflow only attaches binaries — action-gh-release upserts onto
# the existing release for that tag, so no duplicate release is created.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  frontend:
    # Static output is OS-independent — build it once here instead of once
    # per matrix job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist

  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          # The unsuffixed macos name is Apple Silicon — keeping it means apps
          # already installed there keep matching it (see updater.ASSET_NAMES).
          - os: macos-latest # arm64
            artifact: MyJobCoach-macos
          - os: macos-15-intel # x86_64
            artifact: MyJobCoach-macos-intel
          - os: windows-latest
            artifact: MyJobCoach-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install Python deps
        # [local] bundles the free in-process AI engine (llama-cpp-python) that
        # onboarding offers — without it the "download the free local model" path
        # is dead in the shipped app and every user needs an OpenRouter key.
        run: uv sync --extra package --extra local

      - name: Build app bundle
        run: uv run pyinstaller packaging/myjobcoach.spec

      # To ship a warning-free app later, add code-signing/notarization here:
      #  - macOS: codesign the .app, then `xcrun notarytool submit` + `stapler`.
      #  - Windows: signtool / Azure Trusted Signing on dist/MyJobCoach/MyJobCoach.exe.

      - name: Package (macOS .dmg)
        # Stage the .app next to an /Applications symlink, laid out with a
        # background image (packaging/dmg-background.tiff, source + regen
        # recipe in packaging/dmg-background.html) that arrows
        # app -> Applications and spells out the Gatekeeper "Open Anyway"
        # steps for this unsigned build — a bare Finder window left both
        # unclear. The
        # background is a HiDPI TIFF (1x+2x reps via tiffutil -cathidpicheck)
        # — a plain 1x PNG renders blurry on Retina displays.
        # Recipe: build a writable dmg, let Finder position the icons and set
        # the background via AppleScript, then compress. Verified locally,
        # screenshotted by the user on a real Retina display.
        if: runner.os == 'macOS'
        run: |
          mkdir dist/dmg-root dist/dmg-root/.background
          mv "dist/MyJobCoach.app" dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          cp packaging/dmg-background.tiff dist/dmg-root/.background/background.tiff

          hdiutil create -volname "MyJobCoach" -srcfolder dist/dmg-root \
            -ov -format UDRW -fs HFS+ dist/rw.dmg
          hdiutil attach dist/rw.dmg -readwrite -noverify -noautoopen

          osascript \
            -e 'tell application "Finder"' \
            -e 'tell disk "MyJobCoach"' \
            -e 'open' \
            -e 'set current view of container window to icon view' \
            -e 'set toolbar visible of container window to false' \
            -e 'set statusbar visible of container window to false' \
            -e 'set the bounds of container window to {400, 100, 1060, 600}' \
            -e 'set theViewOptions to the icon view options of container window' \
            -e 'set arrangement of theViewOptions to not arranged' \
            -e 'set icon size of theViewOptions to 128' \
            -e 'set background picture of theViewOptions to file ".background:background.tiff"' \
            -e 'set position of item "MyJobCoach.app" of container window to {180, 190}' \
            -e 'set position of item "Applications" of container window to {480, 190}' \
            -e 'close' \
            -e 'open' \
            -e 'update without registering applications' \
            -e 'delay 2' \
            -e 'end tell' \
            -e 'end tell'

          hdiutil detach "/Volumes/MyJobCoach" -force
          hdiutil convert dist/rw.dmg -format UDZO -ov -o "dist/${{ matrix.artifact }}.dmg"
          rm -f dist/rw.dmg

      - name: Package (Windows .zip)
        # Zip the MyJobCoach folder itself (not just its contents) so
        # extracting anywhere yields one clearly-named folder to keep, mirroring
        # the macOS .app bundle instead of scattering loose files.
        #
        # The instructions file is the Windows counterpart of the .dmg's
        # background image: a bare zip has nowhere to say "extract me first,
        # and SmartScreen will warn you". Running the exe from *inside* the zip
        # extracts only that one file to a temp dir, so this onedir build dies
        # on missing DLLs and looks like nothing happened. The "!" prefix is
        # load-bearing — Explorer sorts it above MyJobCoach.exe, so it is read
        # before the mistake, not after.
        if: runner.os == 'Windows'
        run: |
          Copy-Item packaging/windows-README.txt "dist/MyJobCoach/!READ-ME-FIRST.txt"
          Compress-Archive -Path dist/MyJobCoach -DestinationPath dist/MyJobCoach-windows.zip

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: MyJobCoach-*
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
