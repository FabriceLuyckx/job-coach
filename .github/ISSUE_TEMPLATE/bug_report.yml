name: Bug report
description: Report something that's broken
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15 / Windows 11 / ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the About modal (sidebar footer)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: If running from source, paste any console/terminal output.
    validations:
      required: false
