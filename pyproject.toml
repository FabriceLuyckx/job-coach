[project]
name = "job-coach"
version = "0.1.0"
description = "AI-powered career assistant: tailored CV generation and job matching"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
generate-cv = "scripts.generate_cv:main"
tailor-cv   = "scripts.tailor_cv:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "app"]
