[project]
name = "myjobcoach"
version = "0.6.2"
description = "AI-powered career assistant: tailored CV generation and job matching"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "playwright>=1.60.0",
    "platformdirs>=4.0.0",
    "pypdf>=6.14.2",
    "huggingface-hub>=0.24.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
# Tooling for building the downloadable desktop bundle (see packaging/), plus
# pywebview — the packaged launcher's native window (WKWebView/WebView2).
package = [
    "pyinstaller>=6.0.0",
    "pyinstaller-hooks-contrib>=2024.0",
    "pywebview>=5.0",
]
# Local (free) AI engine. Heavy, platform-specific native build; installed for
# source use with `uv sync --extra local` and bundled by the packager. The app
# runs fine without it as long as the OpenRouter engine is used — local.py
# imports llama_cpp lazily.
local = [
    "llama-cpp-python>=0.3.0",
]

[project.scripts]
generate-cv = "scripts.generate_cv:main"
tailor-cv   = "scripts.tailor_cv:main"
myjobcoach  = "app.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
